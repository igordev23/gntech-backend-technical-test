name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      active: ${{ steps.verify.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - id: verify
        run: bash scripts/verify-repo.sh

  validation:
    needs: bootstrap
    if: needs.bootstrap.outputs.active == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://weather:weather@localhost:5432/weather_test
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: bash scripts/run-validation.sh
